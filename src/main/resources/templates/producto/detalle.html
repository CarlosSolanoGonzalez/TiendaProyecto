<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/fragments :: head('Detalle de producto')}"></head>
<body>
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<main class="container py-5">
    <div class="row g-5">
        <div class="col-lg-6">
            <img class="img-fluid rounded-4 shadow-sm detail-image"
                 th:src="${producto.imagenUrl != null ? producto.imagenUrl : 'https://placehold.co/600x800'}"
                 th:alt="${producto.nombre}">
        </div>
        <div class="col-lg-6">
            <p class="text-uppercase small text-secondary mb-2" th:text="${producto.categoria.nombre}">Categoria</p>
            <h1 class="fw-bold mb-3" th:text="${producto.nombre}">Producto</h1>
            <p class="lead text-secondary" th:text="${producto.descripcion}">Descripcion</p>
            <h2 class="fw-bold mb-4" th:text="'$' + ${producto.precio}">$0.00</h2>
            <p class="mb-4">Existencias: <strong th:text="${producto.existencias}">0</strong></p>
            <form class="d-flex gap-3 align-items-center"
                  th:action="@{/carrito/agregar/{id}(id=${producto.id})}"
                  method="post"
                  sec:authorize="isAuthenticated()">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input class="form-control quantity-input" type="number" name="cantidad" min="1" value="1">
                <button class="btn btn-dark btn-lg" type="submit">Agregar al carrito</button>
            </form>
            <a class="btn btn-outline-dark btn-lg" th:href="@{/usuarios/login}" sec:authorize="!isAuthenticated()">
                Inicia sesion para comprar
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
