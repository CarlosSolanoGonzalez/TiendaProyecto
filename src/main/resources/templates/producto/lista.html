<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/fragments :: head('Productos')}"></head>
<body>
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1">Catalogo de productos</h1>
            <p class="text-secondary mb-0">Gestion y consulta de prendas disponibles.</p>
        </div>
        <a class="btn btn-dark" th:href="@{/productos/nuevo}" sec:authorize="hasRole('ADMIN')">Nuevo producto</a>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

    <form class="row g-3 mb-4" method="get" th:action="@{/consulta/productos}">
        <div class="col-md-5">
            <input class="form-control" type="text" name="texto" th:value="${texto}" placeholder="Buscar por nombre">
        </div>
        <div class="col-md-4">
            <select class="form-select" name="categoriaId">
                <option value="">Todas las categorias</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nombre}"
                        th:selected="${categoriaId != null and categoriaId == categoria.id}"></option>
            </select>
        </div>
        <div class="col-md-3 d-grid">
            <button class="btn btn-outline-dark" type="submit">Consultar</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-6 col-xl-4" th:each="producto : ${productos}">
            <div class="card h-100 border-0 shadow-sm">
                <img class="card-img-top listing-image"
                     th:src="${producto.imagenUrl != null ? producto.imagenUrl : 'https://placehold.co/600x800'}"
                     th:alt="${producto.nombre}">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between mb-2">
                        <h5 class="mb-0" th:text="${producto.nombre}">Producto</h5>
                        <span class="badge text-bg-dark" th:text="'$' + ${producto.precio}">$0.00</span>
                    </div>
                    <p class="text-secondary" th:text="${producto.descripcion}">Descripcion</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <small class="text-secondary" th:text="${producto.categoria.nombre}">Categoria</small>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-dark btn-sm" th:href="@{/productos/{id}(id=${producto.id})}">Detalle</a>
                            <a class="btn btn-outline-secondary btn-sm"
                               th:href="@{/productos/{id}/editar(id=${producto.id})}"
                               sec:authorize="hasRole('ADMIN')">Editar</a>
                        </div>
                    </div>
                    <form class="mt-3 d-grid"
                          th:action="@{/carrito/agregar/{id}(id=${producto.id})}"
                          method="post"
                          sec:authorize="isAuthenticated()">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="cantidad" value="1">
                        <button class="btn btn-dark btn-sm" type="submit">Agregar al carrito</button>
                    </form>
                    <form class="mt-3 d-grid"
                          th:action="@{/productos/{id}/eliminar(id=${producto.id})}"
                          method="post"
                          sec:authorize="hasRole('ADMIN')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
