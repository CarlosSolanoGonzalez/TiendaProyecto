<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Carrito')}"></head>
<body>
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1">Carrito de compras</h1>
            <p class="text-secondary mb-0">Revisa los productos antes de comprar.</p>
        </div>
        <span class="badge text-bg-dark p-2"
              th:text="${'Creado: ' + #temporals.format(carrito.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Creado</span>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Imagen</th>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(carrito.items)}">
                            <td colspan="6" class="text-center py-5 text-secondary">No hay productos en el carrito.</td>
                        </tr>
                        <tr th:each="item : ${carrito.items}">
                            <td>
                                <img class="img-thumbnail carrito-image"
                                     th:src="${item.producto.imagenUrl != null ? item.producto.imagenUrl : 'https://placehold.co/200x240'}"
                                     th:alt="${item.producto.nombre}">
                            </td>
                            <td>
                                <div class="fw-semibold" th:text="${item.producto.nombre}">Producto</div>
                                <small class="text-secondary" th:text="${item.producto.categoria.nombre}">Categoria</small>
                            </td>
                            <td th:text="${'$' + item.precio}">$0.00</td>
                            <td>
                                <form class="d-flex gap-2" th:action="@{/carrito/item/{id}/actualizar(id=${item.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input class="form-control quantity-input" type="number" name="cantidad" min="1" th:value="${item.cantidad}">
                                    <button class="btn btn-outline-dark btn-sm" type="submit">Actualizar</button>
                                </form>
                            </td>
                            <td th:text="${'$' + #numbers.formatDecimal(item.precio * item.cantidad, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                            <td class="text-end">
                                <form th:action="@{/carrito/item/{id}/eliminar(id=${item.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h4 fw-bold mb-4">Resumen</h2>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Total</span>
                        <strong th:text="${'$' + total}">$0.00</strong>
                    </div>
                    <form th:action="@{/carrito/comprar}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-dark w-100" type="submit" th:disabled="${#lists.isEmpty(carrito.items)}">Comprar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
